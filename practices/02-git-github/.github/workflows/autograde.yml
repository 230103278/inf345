name: Autograding Tests

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: autograding-${{ github.ref }}
  cancel-in-progress: true

permissions:
  checks: write
  actions: read
  contents: read

jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need full history to count commits

      - name: At least 3 commits beyond the template
        id: commit-count
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: At least 3 commits beyond the template
          command: bash scripts/check_commit_count.sh
          timeout: 1
          max-score: 40

      - name: NOTES.md placeholders replaced
        id: notes
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: NOTES.md placeholders replaced
          command: bash scripts/check_notes.sh
          timeout: 1
          max-score: 30

      - name: CONTRIBUTORS.md exists with your name
        id: contributors
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: CONTRIBUTORS.md exists with your name
          command: bash scripts/check_contributors.sh
          timeout: 1
          max-score: 30

      - name: Autograding Reporter
        uses: classroom-resources/autograding-grading-reporter@v1
        env:
          COMMIT-COUNT_RESULTS: "${{steps.commit-count.outputs.result}}"
          NOTES_RESULTS: "${{steps.notes.outputs.result}}"
          CONTRIBUTORS_RESULTS: "${{steps.contributors.outputs.result}}"
        with:
          runners: commit-count,notes,contributors
