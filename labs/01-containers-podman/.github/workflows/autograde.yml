name: Autograding Tests

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: autograding-${{ github.ref }}
  cancel-in-progress: true

permissions:
  checks: write
  actions: read
  contents: read

jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # GitHub-hosted runners ship Docker, not Podman. We grade with Docker
      # rather than installing Podman in CI, purely to save minutes — the
      # Containerfile syntax the student writes is identical either way
      # (see the README's FOSS-equivalent note), so this doesn't change
      # what's actually being graded.

      - name: Lint Containerfile
        id: lint-containerfile
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Lint Containerfile
          setup-command: >-
            curl -sSfL
            https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64
            -o /usr/local/bin/hadolint && chmod +x /usr/local/bin/hadolint
          command: hadolint submission/Containerfile
          timeout: 2
          max-score: 25

      - name: Build image
        id: build-image
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Build image
          command: docker build -t lab01-submission ./submission
          timeout: 3
          max-score: 35

      - name: Container runs, responds, and is non-root
        id: run-container
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Container runs, responds, and is non-root
          command: bash scripts/check_container_runs.sh
          timeout: 2
          max-score: 40

      - name: Autograding Reporter
        uses: classroom-resources/autograding-grading-reporter@v1
        env:
          LINT-CONTAINERFILE_RESULTS: "${{steps.lint-containerfile.outputs.result}}"
          BUILD-IMAGE_RESULTS: "${{steps.build-image.outputs.result}}"
          RUN-CONTAINER_RESULTS: "${{steps.run-container.outputs.result}}"
        with:
          runners: lint-containerfile,build-image,run-container
