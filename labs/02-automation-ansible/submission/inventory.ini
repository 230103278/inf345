# For running against a real target of your own (e.g. a Vagrant/multipass
# VM, or the RHA lab's provided hosts). The autograder uses Molecule's own
# disposable Docker target instead — see molecule/default/molecule.yml —
# but the group name ("web") matches this inventory so the same site.yml
# works unmodified in both places.
[web]
# your-target-host ansible_host=... ansible_user=...
