---
- name: Verify
  hosts: web
  gather_facts: false
  tasks:
    - name: nginx actually serves the deployed page
      ansible.builtin.uri:
        url: http://localhost/
        return_content: true
      register: result

    - name: fail if the served content doesn't match what should've been deployed
      ansible.builtin.fail:
        msg: "nginx did not serve the expected content from files/index.html"
      when: "'INF345 Lab 02' not in result.content"
