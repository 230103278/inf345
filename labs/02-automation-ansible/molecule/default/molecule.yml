---
# Molecule provides a disposable Docker target so the autograder can prove
# the playbook actually works (and is idempotent) without needing the RHA
# cloud lab's VMs. This is the FOSS-equivalent infrastructure mentioned in
# ../../README.md.
driver:
  name: docker
platforms:
  - name: web-target
    image: geerlingguy/docker-ubuntu2204-ansible:latest
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: /lib/systemd/systemd
    groups:
      - web
provisioner:
  name: ansible
  playbooks:
    converge: ../../site.yml
verifier:
  name: ansible
